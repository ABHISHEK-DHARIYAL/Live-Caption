name: Build Debug APK

# Runs on every push to main, and can also be triggered manually
# from the "Actions" tab in GitHub ("Run workflow" button).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runner already ships with the Android SDK
      # (ANDROID_HOME is set), so we just accept licenses and make sure the
      # platform this project needs (compileSdk 35) is installed.
      - name: Accept licenses and install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # NOTE: this project's gradlew wrapper script/jar was never generated
      # (see README), so we install Gradle directly instead of relying on it.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --console=plain --no-daemon 2>&1 | tee build.log

      # If the build fails, print ONLY the useful lines (compile errors + Gradle's
      # "What went wrong" block) so you don't have to dig through a huge log.
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo "=== Kotlin/Java compile errors ==="
          grep -E "^e: |error:" build.log || echo "(none)"
          echo "=== What went wrong ==="
          grep -A 15 "What went wrong" build.log || echo "(none)"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LectureCaption-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
