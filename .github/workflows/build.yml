name: Build and test

# Tests are blocking: a failing test fails the run. Nothing here uses continue-on-error.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      edition:
        description: "Which app to build: standard (no accessibility service) or full (adds Use words on screen)"
        type: choice
        options: [standard, full]
        default: standard

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (core module and app module)
        run: ./gradlew :core:test :app:testStandardDebugUnitTest --stacktrace

      # One APK per run. Pushes build "standard"; a manual run (Actions > Run workflow) can pick "full".
      - name: Build debug APK
        env:
          EDITION: ${{ github.event.inputs.edition || 'standard' }}
        run: |
          if [ "$EDITION" = "full" ]; then ./gradlew :app:assembleFullDebug --stacktrace; else ./gradlew :app:assembleStandardDebug --stacktrace; fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/test
            app/build/reports/tests/testStandardDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clearcap-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
